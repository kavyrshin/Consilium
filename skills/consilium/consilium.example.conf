# Copy to <project>/.consilium.conf (per project) or ~/.config/consilium/config (all
# projects). Plain KEY=VALUE lines; the file is parsed, never executed. Environment
# variables beat the project file, which beats the user file. No trailing comments.

# Language of the generated documents: en | ru
CM_LANG=en

# Which agent runs the skill: claude | codex. It writes its own review by hand.
CM_HOST=claude

# The panel. Names of adapters; unavailable ones are skipped and reported.
# Bundled adapters: claude codex opencode deepseek mock
CM_REVIEWERS="claude codex opencode"
# First two available ones synthesize the draft decision (first drafts, second revises).
CM_ARBITERS="codex claude"
CM_VERIFIERS="codex claude"
# The first available one implements the confirmed decision.
CM_IMPLEMENTERS="claude codex opencode"

# Where cases are stored, relative to the project root. Keep it inside the project:
# sandboxed reviewers can only write there.
CM_OUT_DIR=consilium

# Models. Leave unset to use each CLI's own configuration.
# CM_CODEX_MODEL=
# CM_CLAUDE_MODEL=
# CM_CLAUDE_EFFORT=high
# Open Code has no default model in headless mode, so one is REQUIRED to enable it:
# CM_OPENCODE_MODEL=provider/model
# or a fallback chain, tried in order:
# CM_OPENCODE_MODELS="provider/model-a provider/model-b"

# Timeouts in seconds.
# CM_REVIEW_TIMEOUT=1800
# CM_DECISION_TIMEOUT=900
# CM_VERIFY_TIMEOUT=2700
# CM_IMPLEMENT_TIMEOUT=2700

# Desktop notification command (gets title and message as arguments); by default the
# first of terminal-notifier / osascript / notify-send that exists. 1 = silence.
# CM_NOTIFY_CMD=
# CM_DISABLE_NOTIFICATIONS=1
